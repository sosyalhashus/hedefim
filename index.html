<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d9488"><title>Hedefim — Hedef Takip</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17252b;background:#f5f7f8}*{box-sizing:border-box}body{margin:0}.app{max-width:620px;margin:auto;padding:22px 16px 95px}header,.between{display:flex;justify-content:space-between;align-items:center;gap:12px}header{margin-bottom:28px}.brand{font-size:24px;font-weight:800}.brand span{color:#0d9488}.sub,.muted{color:#667782;font-size:13px}h1{font-size:25px;margin:4px 0 6px}h2{font-size:17px;margin:0 0 12px}.card{background:white;border:1px solid #e3e9ed;border-radius:17px;padding:17px;margin:12px 0;box-shadow:0 2px 8px #10232b06}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}.big{font-size:31px;font-weight:800;margin:9px 0 0}.bar{height:9px;background:#e9f0f1;border-radius:30px;overflow:hidden;margin:14px 0}.fill{height:100%;background:#10b981;border-radius:30px}.btn{background:#0d9488;color:white;border:0;border-radius:11px;padding:11px 15px;font-size:14px;font-weight:650}.secondary{background:#edf7f5;color:#08796f}.danger{background:#fff0f0;color:#b42318}button{cursor:pointer}input,select{font:inherit}input[type=text],input[type=number],select{width:100%;padding:12px;border:1px solid #dce4e7;border-radius:10px;background:white;margin:6px 0 14px}label{font-size:13px;font-weight:600}.task{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #edf0f2}.task:last-child{border-bottom:0}.task input{width:18px;height:18px;accent-color:#0d9488}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e3e9ed;display:flex;justify-content:space-around;padding:11px max(10px,calc((100vw - 620px)/2));z-index:2}.nav button{border:0;background:none;color:#667782;font-size:12px;padding:7px}.nav button.active{color:#0d9488;font-weight:800}.row{display:flex;gap:8px;flex-wrap:wrap}.spaced{margin-top:22px}.empty{padding:28px;text-align:center;color:#667782}.notice{font-size:12px;color:#667782;margin-top:20px;line-height:1.5}
</style></head><body><main class="app"><header><div><div class="brand">◎ hedefim<span>.</span></div><div class="sub">Her gün bir adım ileri</div></div><span aria-hidden="true">🎯</span></header><section id="content"></section><p class="notice">Bu sürüm verileri yalnızca bu tarayıcıda saklar. Tarayıcı verilerini silersen hedeflerin kaybolabilir. Hesap ve cihazlar arası senkronizasyon henüz yoktur.</p></main><nav class="nav" id="nav"><button data-tab="home">⌂ Ana sayfa</button><button data-tab="goals">◎ Hedefler</button><button data-tab="stats">▥ Analiz</button><button data-tab="about">☷ Bilgi</button></nav><script>
(()=>{'use strict';const KEY='hedefim-v1';let state={goals:[],tab:'home',detail:null,form:false};try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(data))state.goals=data.filter(g=>g&&typeof g.name==='string'&&Array.isArray(g.tasks));}catch{}const $=document.getElementById('content');const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pct=g=>Math.round(Math.min(100,Math.max(0,100*g.current/g.target)));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state.goals))}catch{alert('Tarayıcı verileri kaydedemedi.')}};const btn=(s,a)=>`<button class="btn ${a||''}">${s}</button>`;function card(g){return `<article class="card"><div class="between"><strong>${esc(g.name)}</strong><b style="color:#0d9488">${pct(g)}%</b></div><p class="muted">${esc(g.category)} · ${g.current} / ${g.target} ${esc(g.unit)}</p><div class="bar"><div class="fill" style="width:${pct(g)}%"></div></div><div class="row"><button class="btn secondary" data-open="${g.id}">Detaylar</button><button class="btn" data-plus="${g.id}">+1 ilerleme</button></div></article>`}function home(){const tasks=state.goals.flatMap(g=>g.tasks.map((t,i)=>({...t,id:g.id,index:i})));return `<h1>Bugün neyi başaracaksın? ✨</h1><p class="muted">Küçük adımlar büyük sonuçlar getirir.</p><div class="grid spaced"><div class="card"><div class="muted">Aktif hedefler</div><div class="big">${state.goals.length}</div></div><div class="card"><div class="muted">Tamamlanan görev</div><div class="big">${tasks.filter(t=>t.done).length}/${tasks.length}</div></div></div><div class="between spaced"><h2>Hedeflerim</h2><button class="btn secondary" data-tab="goals">Tümünü gör</button></div>${state.goals.slice(0,2).map(card).join('')||'<div class="card empty">İlk hedefini ekleyerek başla.</div>'}<div class="between spaced"><h2>Görevlerim</h2></div><div class="card">${tasks.map(t=>`<label class="task"><input type="checkbox" data-task="${t.id}:${t.index}" ${t.done?'checked':''}><span style="${t.done?'text-decoration:line-through;color:#667782':''}">${esc(t.name)}</span></label>`).join('')||'<div class="empty">Henüz görev yok.</div>'}</div>`}function goals(){if(state.form)return `<div class="between"><h1>Yeni hedef</h1><button class="btn secondary" data-back>Geri</button></div><form id="goal-form" class="card"><label>Hedef adı<input name="name" type="text" maxlength="90" required placeholder="Örn. 24 kitap okumak"></label><label>Kategori<select name="category"><option>Kişisel gelişim</option><option>Sağlık</option><option>Eğitim</option><option>Kariyer</option><option>Finans</option><option>Diğer</option></select></label><label>Hedef miktarı<input name="target" type="number" min="1" max="1000000" value="24" required></label><label>Birim<input name="unit" type="text" maxlength="30" value="kez" required></label><button class="btn" type="submit">Hedefi kaydet</button></form>`;if(state.detail){const g=state.goals.find(x=>x.id===state.detail);if(!g){state.detail=null;return goals()}return `<div class="between"><h1>${esc(g.name)}</h1><button class="btn secondary" data-back>Geri</button></div><div class="card"><div class="muted">${esc(g.category)}</div><div class="big">${pct(g)}%</div><div class="bar"><div class="fill" style="width:${pct(g)}%"></div></div><p class="muted">${g.current} / ${g.target} ${esc(g.unit)}</p><div class="row"><button class="btn" data-plus="${g.id}">+1 ilerleme</button><button class="btn secondary" data-minus="${g.id}">−1 ilerleme</button></div></div><h2 class="spaced">Alt görevler</h2><div class="card">${g.tasks.map((t,i)=>`<label class="task"><input type="checkbox" data-task="${g.id}:${i}" ${t.done?'checked':''}><span>${esc(t.name)}</span></label>`).join('')||'<div class="muted">Henüz alt görev yok.</div>'}</div><form id="task-form" class="card"><label>Yeni alt görev<input name="task" type="text" maxlength="120" required placeholder="Örn. 20 sayfa oku"></label><button class="btn" type="submit">Görev ekle</button></form><button class="btn danger" data-delete="${g.id}">Hedefi sil</button>`}return `<div class="between"><h1>Hedeflerim</h1><button class="btn" data-new>+ Yeni hedef</button></div>${state.goals.map(card).join('')||'<div class="card empty">Henüz hedef yok. Yeni hedef oluştur.</div>'}`}function stats(){const avg=state.goals.length?Math.round(state.goals.reduce((s,g)=>s+pct(g),0)/state.goals.length):0;return `<h1>İlerleme analizi</h1><p class="muted">Hedeflerinin güncel durumunu gör.</p><div class="grid spaced"><div class="card"><div class="muted">Ortalama ilerleme</div><div class="big">${avg}%</div></div><div class="card"><div class="muted">Tamamlanan hedef</div><div class="big">${state.goals.filter(g=>pct(g)===100).length}</div></div></div><div class="card spaced"><h2>Hedef bazında ilerleme</h2>${state.goals.map(g=>`<div style="margin:20px 0"><div class="between"><span>${esc(g.name)}</span><b>${pct(g)}%</b></div><div class="bar"><div class="fill" style="width:${pct(g)}%"></div></div></div>`).join('')||'<p class="muted">Analiz için hedef ekle.</p>'}</div>`}function about(){return `<h1>Hedefim hakkında</h1><div class="card"><h2>İlk web sürümü</h2><p>Hedef oluşturabilir, alt görevler ekleyebilir ve ilerlemeni takip edebilirsin.</p><p class="muted">Bu uygulama şu an hesap veya sunucu kullanmaz. Her kullanıcının verileri kendi tarayıcısında tutulur. Başka cihazda aynı veriler görünmez.</p><button class="btn danger" data-clear>Tüm verilerimi sil</button></div>`}function render(){ $.innerHTML=state.tab==='home'?home():state.tab==='goals'?goals():state.tab==='stats'?stats():about();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab))}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){state.tab=b.dataset.tab;state.detail=null;state.form=false}else if(b.hasAttribute('data-new')){state.form=true}else if(b.hasAttribute('data-back')){state.form=false;state.detail=null}else if(b.dataset.open){state.tab='goals';state.detail=b.dataset.open}else if(b.dataset.plus||b.dataset.minus){const g=state.goals.find(g=>g.id===(b.dataset.plus||b.dataset.minus));if(g){g.current=Math.max(0,Math.min(g.target,g.current+(b.dataset.plus?1:-1)));save()}}else if(b.dataset.delete){if(confirm('Hedef silinsin mi?')){state.goals=state.goals.filter(g=>g.id!==b.dataset.delete);state.detail=null;save()}}else if(b.hasAttribute('data-clear')){if(confirm('Tüm hedeflerin ve görevlerin silinsin mi?')){state.goals=[];save()}}render()});document.addEventListener('change',e=>{if(!e.target.dataset.task)return;const [id,i]=e.target.dataset.task.split(':');const g=state.goals.find(g=>g.id===id);if(g&&g.tasks[Number(i)]){g.tasks[Number(i)].done=e.target.checked;save();render()}});document.addEventListener('submit',e=>{if(e.target.id==='goal-form'){e.preventDefault();const f=new FormData(e.target),target=Number(f.get('target')),name=String(f.get('name')).trim(),unit=String(f.get('unit')).trim();if(!name||!unit||!Number.isInteger(target)||target<1||target>1000000)return;state.goals.push({id:String(Date.now())+Math.random().toString(36).slice(2),name,category:String(f.get('category')),target,current:0,unit,tasks:[]});state.form=false;save();render()}else if(e.target.id==='task-form'){e.preventDefault();const t=String(new FormData(e.target).get('task')).trim(),g=state.goals.find(g=>g.id===state.detail);if(t&&g){g.tasks.push({name:t,done:false});save();render()}}});render()})();
</script></body></html>
