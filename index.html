<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d9488"><title>Hedefim — Hedef Takip</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17252b;background:#f5f7f8}*{box-sizing:border-box}body{margin:0}.app{max-width:620px;margin:auto;padding:22px 16px 95px}header,.between{display:flex;justify-content:space-between;align-items:center;gap:12px}header{margin-bottom:28px}.brand{font-size:24px;font-weight:800}.brand span{color:#0d9488}.sub,.muted{color:#667782;font-size:13px}h1{font-size:25px;margin:4px 0 6px}h2{font-size:17px;margin:0 0 12px}.card{background:white;border:1px solid #e3e9ed;border-radius:17px;padding:17px;margin:12px 0;box-shadow:0 2px 8px #10232b06}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}.big{font-size:31px;font-weight:800;margin:9px 0 0}.bar{height:9px;background:#e9f0f1;border-radius:30px;overflow:hidden;margin:14px 0}.fill{height:100%;background:#10b981;border-radius:30px}.btn{background:#0d9488;color:white;border:0;border-radius:11px;padding:11px 15px;font-size:14px;font-weight:650}.secondary{background:#edf7f5;color:#08796f}.danger{background:#fff0f0;color:#b42318}button{cursor:pointer}input,select,textarea{font:inherit}input[type=date],textarea{width:100%;padding:12px;border:1px solid #dce4e7;border-radius:10px;background:white;margin:6px 0 14px}textarea{resize:vertical;min-height:80px}.section-title{font-weight:800;margin:18px 0 10px}.hint{font-size:12px;color:#667782;margin:-7px 0 14px}.form-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.steps-field{margin:8px 0 14px}.steps-field input{margin:4px 0}.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:390px){.two-fields{grid-template-columns:1fr}}input[type=text],input[type=number],select{width:100%;padding:12px;border:1px solid #dce4e7;border-radius:10px;background:white;margin:6px 0 14px}label{font-size:13px;font-weight:600}.task{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #edf0f2}.task:last-child{border-bottom:0}.task input{width:18px;height:18px;accent-color:#0d9488}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e3e9ed;display:flex;justify-content:space-around;padding:11px max(10px,calc((100vw - 620px)/2));z-index:2}.nav button{border:0;background:none;color:#667782;font-size:12px;padding:7px}.nav button.active{color:#0d9488;font-weight:800}.row{display:flex;gap:8px;flex-wrap:wrap}.spaced{margin-top:22px}.empty{padding:28px;text-align:center;color:#667782}.notice{font-size:12px;color:#667782;margin-top:20px;line-height:1.5}
 .authbox{max-width:440px;margin:35px auto}.authbox input{width:100%;padding:12px;border:1px solid #dce4e7;border-radius:10px;margin:6px 0 12px}.error{color:#b42318;font-size:13px;white-space:pre-wrap}.status{font-size:12px;color:#667782;margin-top:8px}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script></head><body><main class="app"><header><div><div class="brand">◎ hedefim<span>.</span></div><div class="sub">Her gün bir adım ileri</div></div><span aria-hidden="true">🎯</span></header><section id="content"></section><p class="notice">Hedeflerin giriş yaptığın hesaba bağlı olarak bulutta saklanır. Hesap bilgilerini kimseyle paylaşma.</p></main><nav class="nav" id="nav"><button data-tab="home">⌂ Ana sayfa</button><button data-tab="goals">◎ Hedefler</button><button data-tab="stats">▥ Analiz</button><button data-tab="about">☷ Bilgi</button></nav><script src="./config.js"></script><script>
(()=>{'use strict';const KEY='hedefim-v1';let state={goals:[],tab:'home',detail:null,form:false};
const settings=window.HEDEFIM_CONFIG||{};
const configured=!!(settings.supabaseUrl&&settings.supabaseAnonKey&&!settings.supabaseUrl.includes('BURAYA'));
const db=configured&&window.supabase?window.supabase.createClient(settings.supabaseUrl,settings.supabaseAnonKey):null;
let user=null,loading=true,saving=Promise.resolve(),message='';
const $=document.getElementById('content');const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pct=g=>Math.round(Math.min(100,Math.max(0,100*g.current/g.target)));const save=()=>{if(!user||!db)return;const uid=user.id, snapshot=JSON.parse(JSON.stringify(state.goals));saving=saving.catch(()=>{}).then(async()=>{if(user?.id!==uid)return;const {error}=await db.from('user_data').upsert({user_id:uid,goals:snapshot},{onConflict:'user_id'});if(error){message='Kaydetme hatası: '+error.message;render()}})};
async function loadData(){loading=true;render();const {data,error}=await db.from('user_data').select('goals').eq('user_id',user.id).maybeSingle();if(error){message='Veriler okunamadı: '+error.message;state.goals=[]}else{state.goals=Array.isArray(data?.goals)?data.goals:[];message=''}loading=false;render()}
function authScreen(){return `<div class="card authbox"><h1>Hedefim'e hoş geldin</h1><p class="muted">Hedeflerini cihazların arasında senkronize etmek için giriş yap.</p><form id="auth-form"><label>E-posta<input name="email" type="email" required autocomplete="email" placeholder="ornek@eposta.com"></label><label>Şifre<input name="password" type="password" minlength="6" required autocomplete="current-password" placeholder="En az 6 karakter"></label><div class="row"><button class="btn" name="action" value="login">Giriş yap</button><button class="btn secondary" name="action" value="signup">Kayıt ol</button></div></form><p class="status">Kayıt sonrasında e-posta doğrulaması istenebilir.</p>${message?`<p class="error">${esc(message)}</p>`:''}</div>`}
const btn=(s,a)=>`<button class="btn ${a||''}">${s}</button>`;function card(g){return `<article class="card"><div class="between"><strong>${esc(g.name)}</strong><b style="color:#0d9488">${pct(g)}%</b></div><p class="muted">${esc(g.category)} · ${g.current} / ${g.target} ${esc(g.unit)}</p><div class="bar"><div class="fill" style="width:${pct(g)}%"></div></div><div class="row"><button class="btn secondary" data-open="${g.id}">Detaylar</button><button class="btn" data-plus="${g.id}">+1 ilerleme</button></div></article>`}function home(){const tasks=state.goals.flatMap(g=>(g.tasks||[]).map((t,i)=>({...t,id:g.id,index:i})));return `<h1>Bugün neyi başaracaksın? ✨</h1><p class="muted">Küçük adımlar büyük sonuçlar getirir.</p><div class="grid spaced"><div class="card"><div class="muted">Aktif hedefler</div><div class="big">${state.goals.length}</div></div><div class="card"><div class="muted">Tamamlanan görev</div><div class="big">${tasks.filter(t=>t.done).length}/${tasks.length}</div></div></div><div class="between spaced"><h2>Hedeflerim</h2><button class="btn secondary" data-tab="goals">Tümünü gör</button></div>${state.goals.slice(0,2).map(card).join('')||'<div class="card empty">İlk hedefini ekleyerek başla.</div>'}<div class="between spaced"><h2>Görevlerim</h2></div><div class="card">${tasks.map(t=>`<label class="task"><input type="checkbox" data-task="${t.id}:${t.index}" ${t.done?'checked':''}><span style="${t.done?'text-decoration:line-through;color:#667782':''}">${esc(t.name)}</span></label>`).join('')||'<div class="empty">Henüz görev yok.</div>'}</div>`}function goals(){if(state.form)return `<div class="between"><h1>Yeni hedef</h1><button class="btn secondary" data-back>Geri</button></div><form id="goal-form" class="card"><div class="section-title">Temel bilgiler</div><label>Hedef adı<input name="name" type="text" maxlength="90" required placeholder="Örn. Yılda 24 kitap okumak"></label><label>Kategori<select name="category"><option>Kişisel gelişim</option><option>Sağlık ve spor</option><option>Eğitim</option><option>Kariyer ve iş</option><option>Finans</option><option>Hobi ve yaşam</option><option>Diğer</option></select></label><label>Bu hedefi neden istiyorsun?<textarea name="description" maxlength="600" placeholder="Hedefin açıklaması ve motivasyonun"></textarea></label><div class="two-fields"><label>Hedef miktarı<input name="target" type="number" min="1" max="1000000" value="24" required></label><label>Birim<input name="unit" type="text" maxlength="30" value="kitap" required></label></div><div class="two-fields"><label>Başlangıç tarihi<input name="startDate" type="date" value="${new Date().toISOString().slice(0,10)}" required></label><label>Bitiş tarihi<input name="endDate" type="date" value="${new Date(new Date().setFullYear(new Date().getFullYear()+1)).toISOString().slice(0,10)}" required></label></div><div class="section-title">Planlama</div><label>Takip sıklığı<select name="frequency"><option value="daily">Günlük</option><option value="weekly" selected>Haftalık</option><option value="monthly">Aylık</option><option value="flexible">Esnek</option></select></label><label>Öncelik<select name="priority"><option value="low">Düşük</option><option value="medium">Orta</option><option value="high" selected>Yüksek</option></select></label><label>Küçük adımlar</label><p class="hint">Her satıra bir adım yaz. Boş satırları atlayacağız.</p><div class="steps-field"><input name="step1" type="text" maxlength="120" placeholder="1. adım"><input name="step2" type="text" maxlength="120" placeholder="2. adım"><input name="step3" type="text" maxlength="120" placeholder="3. adım"><input name="step4" type="text" maxlength="120" placeholder="4. adım"><input name="step5" type="text" maxlength="120" placeholder="5. adım"></div><label class="task"><input name="reminder" type="checkbox" value="yes"> Hatırlatıcı tercihini kaydet</label><p class="hint">Bu seçenek yalnızca tercihini saklar; otomatik bildirim göndermez.</p><div class="form-actions"><button class="btn" type="submit">Hedefi kaydet</button><button class="btn secondary" type="button" data-back>Vazgeç</button></div></form>`;if(state.detail){const g=state.goals.find(x=>x.id===state.detail);if(!g){state.detail=null;return goals()}return `<div class="between"><h1>${esc(g.name)}</h1><button class="btn secondary" data-back>Geri</button></div><div class="card"><div class="muted">${esc(g.category)}</div>${g.description?`<p>${esc(g.description)}</p>`:""}${g.startDate?`<p class="muted">Tarih: ${esc(g.startDate)} → ${esc(g.endDate||"Belirtilmedi")}</p>`:""}${g.frequency?`<p class="muted">Takip: ${esc(({daily:"Günlük",weekly:"Haftalık",monthly:"Aylık",flexible:"Esnek"})[g.frequency]||g.frequency)} · Öncelik: ${esc(({low:"Düşük",medium:"Orta",high:"Yüksek"})[g.priority]||"Belirtilmedi")}</p>`:""}${g.reminder?`<p class="muted">Hatırlatıcı tercihi açık (bildirim etkin değil)</p>`:""}<div class="big">${pct(g)}%</div><div class="bar"><div class="fill" style="width:${pct(g)}%"></div></div><p class="muted">${g.current} / ${g.target} ${esc(g.unit)}</p><div class="row"><button class="btn" data-plus="${g.id}">+1 ilerleme</button><button class="btn secondary" data-minus="${g.id}">−1 ilerleme</button></div></div><h2 class="spaced">Alt görevler</h2><div class="card">${(g.tasks||[]).map((t,i)=>`<label class="task"><input type="checkbox" data-task="${g.id}:${i}" ${t.done?'checked':''}><span>${esc(t.name)}</span></label>`).join('')||'<div class="muted">Henüz alt görev yok.</div>'}</div><form id="task-form" class="card"><label>Yeni alt görev<input name="task" type="text" maxlength="120" required placeholder="Örn. 20 sayfa oku"></label><button class="btn" type="submit">Görev ekle</button></form><button class="btn danger" data-delete="${g.id}">Hedefi sil</button>`}return `<div class="between"><h1>Hedeflerim</h1><button class="btn" data-new>+ Yeni hedef</button></div>${state.goals.map(card).join('')||'<div class="card empty">Henüz hedef yok. Yeni hedef oluştur.</div>'}`}function stats(){const avg=state.goals.length?Math.round(state.goals.reduce((s,g)=>s+pct(g),0)/state.goals.length):0;return `<h1>İlerleme analizi</h1><p class="muted">Hedeflerinin güncel durumunu gör.</p><div class="grid spaced"><div class="card"><div class="muted">Ortalama ilerleme</div><div class="big">${avg}%</div></div><div class="card"><div class="muted">Tamamlanan hedef</div><div class="big">${state.goals.filter(g=>pct(g)===100).length}</div></div></div><div class="card spaced"><h2>Hedef bazında ilerleme</h2>${state.goals.map(g=>`<div style="margin:20px 0"><div class="between"><span>${esc(g.name)}</span><b>${pct(g)}%</b></div><div class="bar"><div class="fill" style="width:${pct(g)}%"></div></div></div>`).join('')||'<p class="muted">Analiz için hedef ekle.</p>'}</div>`}function about(){return `<h1>Hedefim hakkında</h1><div class="card"><h2>İlk web sürümü</h2><p>Hedef oluşturabilir, alt görevler ekleyebilir ve ilerlemeni takip edebilirsin.</p><p class="muted">Hedeflerin hesabına bağlı olarak bulutta saklanır. Verilerine yalnızca kendi hesabınla erişebilirsin.</p><button class="btn danger" data-clear>Tüm verilerimi sil</button><button class="btn secondary" data-logout style="margin-left:8px">Çıkış yap</button></div>`}function render(){if(!configured){$.innerHTML='<div class="card"><h2>Kurulum gerekli</h2><p>Supabase bağlantı bilgilerini config.js dosyasına ekle. README dosyasındaki adımları izle.</p></div>';return}if(loading){$.innerHTML='<div class="card">Yükleniyor…</div>';return}if(!user){$.innerHTML=authScreen();document.getElementById('nav').style.display='none';return}document.getElementById('nav').style.display='flex'; $.innerHTML=state.tab==='home'?home():state.tab==='goals'?goals():state.tab==='stats'?stats():about();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab))}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.closest('form') && b.type==='submit')return;if(b.hasAttribute('data-logout')){db.auth.signOut();return}if(!user)return;if(b.dataset.tab){state.tab=b.dataset.tab;state.detail=null;state.form=false}else if(b.hasAttribute('data-new')){state.form=true}else if(b.hasAttribute('data-back')){state.form=false;state.detail=null}else if(b.dataset.open){state.tab='goals';state.detail=b.dataset.open}else if(b.dataset.plus||b.dataset.minus){const g=state.goals.find(g=>g.id===(b.dataset.plus||b.dataset.minus));if(g){g.current=Math.max(0,Math.min(g.target,g.current+(b.dataset.plus?1:-1)));save()}}else if(b.dataset.delete){if(confirm('Hedef silinsin mi?')){state.goals=state.goals.filter(g=>g.id!==b.dataset.delete);state.detail=null;save()}}else if(b.hasAttribute('data-clear')){if(confirm('Tüm hedeflerin ve görevlerin silinsin mi?')){state.goals=[];save()}}render()});document.addEventListener('change',e=>{if(!e.target.dataset.task)return;const [id,i]=e.target.dataset.task.split(':');const g=state.goals.find(g=>g.id===id);if(g&&g.tasks[Number(i)]){g.tasks[Number(i)].done=e.target.checked;save();render()}});document.addEventListener('submit',async e=>{if(e.target.id==='auth-form'){e.preventDefault();const f=new FormData(e.target),email=String(f.get('email')).trim(),password=String(f.get('password'));const action=e.submitter?.value||'login';message='İşleniyor…';render();const result=action==='signup'?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});message=result.error?result.error.message:(action==='signup'&&!result.data.session?'E-posta doğrulama bağlantısını kontrol et.':'');render();return}if(!user)return;if(e.target.id==='goal-form'){e.preventDefault();const f=new FormData(e.target),target=Number(f.get('target')),name=String(f.get('name')).trim(),unit=String(f.get('unit')).trim();if(!name||!unit||!Number.isInteger(target)||target<1||target>1000000)return;const startDate=String(f.get('startDate')||''),endDate=String(f.get('endDate')||'');if(!startDate||!endDate||endDate<startDate){alert('Bitiş tarihi başlangıç tarihinden önce olamaz.');return}const tasks=[1,2,3,4,5].map(i=>String(f.get('step'+i)||'').trim()).filter(Boolean).map(name=>({name,done:false}));state.goals.push({id:String(Date.now())+Math.random().toString(36).slice(2),name,category:String(f.get('category')),description:String(f.get('description')||'').trim(),target,current:0,unit,startDate,endDate,frequency:String(f.get('frequency')),priority:String(f.get('priority')),reminder:f.get('reminder')==='yes',tasks});state.form=false;save();render()}else if(e.target.id==='task-form'){e.preventDefault();const t=String(new FormData(e.target).get('task')).trim(),g=state.goals.find(g=>g.id===state.detail);if(t&&g){(g.tasks||(g.tasks=[])).push({name:t,done:false});save();render()}}});if(db){db.auth.onAuthStateChange((event,session)=>{const next=session?.user||null;if(next?.id!==user?.id){user=next;state.goals=[];state.tab='home';state.detail=null;state.form=false;if(user){loadData()}else{loading=false;render()}}});db.auth.getSession().then(({data,error})=>{if(error)message=error.message;user=data?.session?.user||null;if(user)loadData();else{loading=false;render()}}).catch(e=>{message=e.message;loading=false;render()})}else{loading=false;render()}})();
</script></body></html>
